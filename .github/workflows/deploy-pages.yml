name: Deploy Provenance Examiner to Pages

# Builds the self-contained single-page app in apps/web and publishes it to
# GitHub Pages. The output is one inline HTML file with no external assets,
# so it works at any Pages base path.

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "libs/watermark-text-check/src/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install web app dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Build the single-page app
        working-directory: apps/web
        run: node build.mjs

      - name: Stage the site
        run: |
          mkdir -p _site
          cp apps/web/dist/index.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
